<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PayPal JS SDK V6 Demo</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #f5f7fa;
        color: #333;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
      }

      .container {
        max-width: 480px;
        width: 100%;
      }

      h1 {
        font-size: 1.5rem;
        margin-bottom: 24px;
        text-align: center;
      }

      .card {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 32px;
        margin-bottom: 24px;
      }

      .order-summary {
        border-bottom: 1px solid #eee;
        padding-bottom: 16px;
        margin-bottom: 24px;
      }

      .order-summary h2 {
        font-size: 1.1rem;
        margin-bottom: 12px;
      }

      .line-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 0.95rem;
      }

      .line-item.total {
        font-weight: 700;
        font-size: 1.1rem;
        border-top: 1px solid #eee;
        padding-top: 8px;
        margin-top: 8px;
      }

      #paypal-button-container {
        min-height: 50px;
      }

      #status {
        text-align: center;
        padding: 12px;
        border-radius: 6px;
        font-size: 0.9rem;
        display: none;
      }

      #status.info {
        display: block;
        background: #e8f4fd;
        color: #1a73e8;
      }

      #status.success {
        display: block;
        background: #e6f4ea;
        color: #137333;
      }

      #status.error {
        display: block;
        background: #fce8e6;
        color: #c5221f;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>PayPal XB Pay Later Message test page</h1>

      <div class="card">
        <ol>
          <li>
            <a href="/plmag.html" target="_blank">Sandbox Gordon Demo</a>
          </li>
          <li>
            <a href="/plmag-us.html" target="_blank">Sandbox Gordon Demo - US</a>
          </li>
          <li>
            <a href="/plmag-hk-acct-xb-gb.html" target="_blank">Sandbox Gordon Demo - HK acct for GB XB PL Msg</a>
          </li>
          <li>
            <a href="/plmag-us-acct-xb-gb.html" target="_blank">Sandbox Gordon Demo - US acct for GB XB PL Msg</a>
          </li>
          <li>
            <a href="/plmag-gb-insta360.html" target="_blank">Production Biz acct - GB XB PL Msg</a>
          </li>
        </ol>
      </div>

    </div>

    
  </body>
</html>
